<!DOCTYPE html>
<html>
<head>
    <title>Student Record System</title>
</head>

<body>

<h2>Student Record System</h2>

<input type="text" id="name" placeholder="Name">
<input type="text" id="age" placeholder="Age">
<input type="text" id="course" placeholder="Course">

<button id="addBtn">Add</button>
<button id="updateBtn" style="display:none;">Update</button>

<br><br>

<input type="text" id="searchBox" placeholder="Search Student">

<br><br>

<b>Total Students:</b> <span id="total">0</span>

<br><br>

<table border="1" id="table">
    <tr>
        <th>Name</th>
        <th>Age</th>
        <th>Course</th>
        <th>Action</th>
    </tr>
</table>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

<script>

$(function () {

    let rowSelect = null;

    function check(n, a, c) {
        if (n == "" || !isNaN(n)) return false;
        if (a == "" || isNaN(a)) return false;
        if (c == "" || !isNaN(c)) return false;
        return true;
    }

    function countRows() {
        $("#total").text($("#table tr").length - 1);
    }

    $("#addBtn").click(function () {

        let n = $("#name").val();
        let a = $("#age").val();
        let c = $("#course").val();

        if (!check(n, a, c)) {
            alert("Invalid Input");
            return;
        }

        $("#table").append(
            "<tr>" +
            "<td>" + n + "</td>" +
            "<td>" + a + "</td>" +
            "<td>" + c + "</td>" +
            "<td><button class='edit'>Edit</button> <button class='del'>Delete</button></td>" +
            "</tr>"
        );

        $("#name, #age, #course").val("");

        countRows();
    });

    $(document).on("click", ".del", function () {
        $(this).parent().parent().remove();
        countRows();
    });

    $(document).on("click", ".edit", function () {

        rowSelect = $(this).parent().parent();

        $("#name").val(rowSelect.find("td:eq(0)").text());
        $("#age").val(rowSelect.find("td:eq(1)").text());
        $("#course").val(rowSelect.find("td:eq(2)").text());

        $("#addBtn").hide();
        $("#updateBtn").show();
    });

    $("#updateBtn").click(function () {

        let n = $("#name").val();
        let a = $("#age").val();
        let c = $("#course").val();

        if (!check(n, a, c)) {
            alert("Invalid Input");
            return;
        }

        rowSelect.find("td:eq(0)").text(n);
        rowSelect.find("td:eq(1)").text(a);
        rowSelect.find("td:eq(2)").text(c);

        $("#name, #age, #course").val("");

        $("#addBtn").show();
        $("#updateBtn").hide();

        rowSelect = null;
    });

    $("#searchBox").keyup(function () {

        let text = $(this).val().toLowerCase();

        $("#table tr").each(function (index) {

            if (index === 0) return;

            let rowText = $(this).text().toLowerCase();

            if (rowText.indexOf(text) > -1) {
                $(this).show();
            } else {
                $(this).hide();
            }
        });
    });

});

</script>

</body>
</html>
